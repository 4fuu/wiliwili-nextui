name: NextUI tg5040 (validate default)

# Cross-builds wiliwili for NextUI on the TrimUI Brick Pro (tg5040) inside the
# NextUI toolchain container. Produces a complete WiliWili.pakz artifact:
# aarch64 binary, GLES3 UI, libmpv/FFmpeg with both the software decoder and
# the CedarX hardware H.264 decoder (h264_cedar), no nonfree code.
#
# Hardware decode is a setting, off by default: with it on, mpv decodes H.264
# through the device's vendor decoder (see NEXTUI.md); off, nothing changes.
#
# The host orb has no Docker, so this workflow is the authoritative aarch64
# build. The recipe is the same one a Docker host runs locally:
#   make -f ... (see NEXTUI.md)

on:
  push:
    branches:
      - feat/cedar-hwdec
  workflow_dispatch:
    inputs:
      mpv_no_fb:
        description: 'Build the MPV_NO_FB render path (FBO path is the default)'
        type: boolean
        default: false

concurrency:
  group: nextui-tg5040-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build WiliWili.pakz
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/loveretro/tg5040-toolchain:latest
    env:
      JOBS: 4
      MPV_NO_FB: ${{ github.event.inputs.mpv_no_fb == 'true' && '1' || '0' }}
      FFMPEG_EXTRA_SRC: scripts/nextui/ffmpeg/h264_cedardec.c
      FFMPEG_EXTRA_COMPONENTS: decoder=h264_cedar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends meson zip file bzip2 curl ca-certificates binutils

      # The patched decoder source is copied from inside $SRC; make it absolute.
      - name: Resolve decoder path
        run: echo "FFMPEG_EXTRA_SRC=$GITHUB_WORKSPACE/$FFMPEG_EXTRA_SRC" >> "$GITHUB_ENV"

      # The vendor SDK's glibc 2.25 and ld 2.33 cannot build libavcodec or
      # libsbm, so the C library and linker come from Bootlin's glibc 2.31.
      - name: Toolchain (vendor SDK + Bootlin glibc 2.31)
        run: |
          sh ./scripts/nextui/cedar/toolchain.sh > /tmp/cedar-env.sh
          . /tmp/cedar-env.sh
          # Under their own names: a CFLAGS written to $GITHUB_ENV would
          # override the flags inside CMake's toolchain file.
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "CEDAR_TOOLCHAIN_DIR=$CEDAR_TOOLCHAIN_DIR" >> "$GITHUB_ENV"
          echo "CEDAR_CFLAGS=$CEDAR_CFLAGS" >> "$GITHUB_ENV"
          echo "CEDAR_CXXFLAGS=$CEDAR_CXXFLAGS" >> "$GITHUB_ENV"
          echo "CEDAR_LDFLAGS=$CEDAR_LDFLAGS" >> "$GITHUB_ENV"
          aarch64-buildroot-linux-gnu-gcc --version | head -1

      - name: Show toolchain
        run: |
          echo "CROSS_TRIPLE=$CROSS_TRIPLE"
          echo "SYSROOT=$SYSROOT"
          ${CROSS_TRIPLE}-gcc --version | head -1
          meson --version
          pkg-config --modversion sdl2 glesv2 alsa

      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: .nextui-build/src
          key: nextui-deps-src-${{ hashFiles('scripts/nextui/build-deps.sh', 'scripts/nextui/ffmpeg/h264_cedardec.c') }}

      - name: Build dependencies (FFmpeg with h264_cedar, libmpv, libass)
        run: CFLAGS="$CEDAR_CFLAGS" CXXFLAGS="$CEDAR_CXXFLAGS" LDFLAGS="$CEDAR_LDFLAGS" ./scripts/nextui/build-deps.sh

      - name: Build wiliwili
        run: ./scripts/nextui/build-wiliwili.sh

      - name: Build the on-device decode tester
        run: ./scripts/nextui/cedar/make-tester

      - name: Package pak
        run: ./scripts/nextui/make-pak.sh

      - name: Verify the pak
        run: |
          # Fail instead of shipping a pak without the hardware decoder.
          strings dist/WiliWili.pak/lib/libavcodec.so.60 | grep -qx h264_cedar
          strings dist/WiliWili.pak/lib/libavcodec.so.60 | grep -qx h264_mp4toannexb
          test -x dist/WiliWili.pak/bin/cedar-decode
          test -x dist/WiliWili.pak/bin/wiliwili

      - name: Build summary
        run: |
          {
            echo "### NextUI tg5040 build"
            echo
            echo "- mpv: $(pkg-config --modversion mpv)"
            echo "- libass: $(pkg-config --modversion libass)"
            echo "- libavcodec: $(pkg-config --modversion libavcodec)"
            echo "- SDL2 (device-provided): $(pkg-config --modversion sdl2)"
            echo "- pakz size: $(du -h dist/WiliWili.pakz | cut -f1)"
            echo
            echo "Bundled libraries:"
            echo '```'
            ls dist/WiliWili.pak/lib
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pakz
        uses: actions/upload-artifact@v4
        with:
          name: WiliWili-tg5040-validate
          path: dist/WiliWili.pakz
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WiliWili-tg5040-logs
          path: |
            .nextui-build/deps/meson-logs/
            build-nextui/CMakeCache.txt
          if-no-files-found: ignore
